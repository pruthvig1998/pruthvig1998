<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatar Gaze Lab - dummy test page (not the portfolio)</title>
<style>
  :root{ --wine:#1D040B; --wine2:#430A1B; --rose:#E5484D; --soft:#F0A3A8; --pale:#F6D5D8; --ivory:#ECE7DF; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  body{ background:var(--wine); color:var(--ivory); font-family:Georgia, 'Times New Roman', serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; }
  header{ padding:18px 16px 4px; text-align:center; }
  header h1{ font-size:20px; font-weight:normal; letter-spacing:.04em; }
  header p{ font-size:13px; color:var(--soft); margin-top:4px; font-style:italic; }
  #stage-wrap{ flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:10px; }
  #stack{ width:min(92vw, 540px); aspect-ratio:1/1; will-change:transform; }
  #stage{ width:100%; height:100%; display:block; border-radius:6px; }
  #panel{ width:min(94vw, 640px); background:var(--wine2); border:1px solid rgba(240,163,168,.25); border-radius:10px; padding:12px 16px 14px; margin:0 0 22px; font-size:13px; }
  #panel .row{ display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; margin:6px 0; }
  #panel label{ color:var(--pale); display:flex; gap:6px; align-items:center; }
  #panel input[type=range]{ accent-color:var(--rose); width:110px; }
  #panel button{ background:var(--rose); color:#fff; border:0; border-radius:6px; padding:5px 12px; font-family:inherit; font-size:13px; cursor:pointer; }
  #panel button.ghost{ background:transparent; border:1px solid var(--soft); color:var(--soft); }
  #readout{ font-family:ui-monospace, Menlo, monospace; font-size:12px; color:var(--soft); min-height:16px; }
  .val{ color:var(--ivory); font-family:ui-monospace, Menlo, monospace; font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Avatar Gaze Lab</h1>
  <p>Dummy test page. The AI avatar follows your cursor, reel-style: baked look-around frames picked by direction. Nothing here touches the portfolio.</p>
</header>
<div id="stage-wrap">
  <div id="stack"><canvas id="stage" width="640" height="640"></canvas></div>
</div>
<div id="panel">
  <div class="row">
    <label>Gaze range <input id="range" type="range" min="0.5" max="1.5" step="0.1" value="1"><span class="val" id="range-v">1.0</span></label>
    <label>Spring <input id="stiff" type="range" min="200" max="700" step="20" value="420"><span class="val" id="stiff-v">420</span></label>
  </div>
  <div class="row">
    <label><input type="checkbox" id="blink-on" checked> Blink</label>
    <label><input type="checkbox" id="idle-on" checked> Idle glances</label>
    <label><input type="checkbox" id="sacc-on" checked> Micro-saccades</label>
    <button id="tour" type="button">Corner tour</button>
    <button id="centre" class="ghost" type="button">Centre</button>
  </div>
  <div class="row"><span id="readout">loading frames...</span></div>
</div>
<script>
"use strict";
const GX = [-1, -0.67, -0.33, 0, 0.33, 0.67, 1];
const GY = [-0.75, -0.38, 0, 0.38, 0.75];
const EYES640 = [[290, 207], [354, 216]];
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
const stack = document.getElementById('stack');
const readout = document.getElementById('readout');
const sheet = new Image();
let ready = false;
sheet.onload = () => { ready = true; };
sheet.src = 'frames-sheet.webp';

const ui = {
  range: document.getElementById('range'), stiff: document.getElementById('stiff'),
  blink: document.getElementById('blink-on'), idle: document.getElementById('idle-on'),
  sacc: document.getElementById('sacc-on')
};
for (const k of ['range', 'stiff']) {
  const v = document.getElementById(k + '-v');
  ui[k].addEventListener('input', () => { v.textContent = parseFloat(ui[k].value).toFixed(1); });
}
const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let ptrX = innerWidth / 2, ptrY = innerHeight / 2, lastPtr = -1e9;
addEventListener('pointermove', e => { ptrX = e.clientX; ptrY = e.clientY; lastPtr = performance.now(); }, { passive: true });

let tourPts = null, tourIdx = 0, tourUntil = 0;
document.getElementById('tour').addEventListener('click', () => {
  const w = innerWidth, h = innerHeight, m = 60;
  tourPts = [[m, m], [w - m, m], [w - m, h - m], [m, h - m], [w / 2, h / 2]];
  tourIdx = 0; tourUntil = performance.now() + 1100;
});
document.getElementById('centre').addEventListener('click', () => {
  tourPts = [[innerWidth / 2, innerHeight / 2]]; tourIdx = 0; tourUntil = performance.now() + 1500;
});

function Spring(k, c, m) { return { x: 0, y: 0, vx: 0, vy: 0, k, c, m }; }
const gaze = Spring(420, 22, 0.45);
function stepSpring(s, tx, ty, dt) {
  const n = Math.max(1, Math.ceil(dt / (1 / 480)));
  const h = dt / n;
  for (let i = 0; i < n; i++) {
    s.vx += (-s.k * (s.x - tx) - s.c * s.vx) / s.m * h;
    s.vy += (-s.k * (s.y - ty) - s.c * s.vy) / s.m * h;
    s.x += s.vx * h; s.y += s.vy * h;
  }
}
const GLANCES = [[-0.7, -0.3], [0.6, -0.45], [0.85, 0.2], [-0.5, 0.35], [0.3, 0.5], [-0.85, -0.1], [0, 0]];
let glance = null, glanceUntil = 0;
let sacX = 0, sacY = 0, sacUntil = 0;
let nextBlink = performance.now() + 2600, blinkStart = -1, doublePending = false;

function nearestIdx(arr, v) {
  let bi = 0, bd = 1e9;
  for (let i = 0; i < arr.length; i++) { const d = Math.abs(arr[i] - v); if (d < bd) { bd = d; bi = i; } }
  return bi;
}
function drawBlink(cov, gx, gy) {
  if (cov <= 0.001) return;
  for (const [ex, ey] of EYES640) {
    const cxp = ex + gx * -22, cyp = ey + gy * 9;
    const hgt = cov * 30;
    const grad = ctx.createLinearGradient(0, cyp - hgt / 2, 0, cyp + hgt / 2);
    grad.addColorStop(0, '#C68D70'); grad.addColorStop(1, '#A06A4C');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(cxp, cyp, 30, Math.max(hgt / 2, 0.6), 0, 0, Math.PI * 2);
    ctx.fill();
    if (cov > 0.65) {
      ctx.strokeStyle = 'rgba(58,36,26,0.85)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(cxp, cyp, 30, Math.max(hgt / 2, 0.6), 0, Math.PI * 0.15, Math.PI * 0.85);
      ctx.stroke();
    }
  }
}

let lastT = performance.now(), lastKey = '';
function frame(now) {
  requestAnimationFrame(frame);
  if (!ready || document.hidden) { lastT = now; return; }
  let dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;
  if (dt <= 0) dt = 0.016;

  if (tourPts) {
    if (now > tourUntil) { tourIdx++; tourUntil = now + 1100; }
    if (tourIdx >= tourPts.length) { tourPts = null; }
    else { ptrX = tourPts[tourIdx][0]; ptrY = tourPts[tourIdx][1]; lastPtr = now; }
  }

  const rect = cv.getBoundingClientRect();
  const cxp = rect.left + rect.width * 0.503, cyp = rect.top + rect.height * 0.33;
  let tx = (ptrX - cxp) / (innerWidth * 0.42), ty = (ptrY - cyp) / (innerHeight * 0.42);
  tx = Math.max(-1.15, Math.min(1.15, tx)); ty = Math.max(-1.15, Math.min(1.15, ty));

  let state = 'tracking';
  if (ui.idle.checked && !reduced && now - lastPtr > 3000) {
    state = 'idle glancing';
    if (!glance || now > glanceUntil) {
      glance = GLANCES[Math.floor(Math.random() * GLANCES.length)];
      glanceUntil = now + 900 + Math.random() * 1300;
    }
    tx = glance[0]; ty = glance[1];
  } else { glance = null; }

  if (ui.sacc.checked && !reduced && now > sacUntil) {
    sacX = (Math.random() - 0.5) * 0.08; sacY = (Math.random() - 0.5) * 0.06;
    sacUntil = now + 250 + Math.random() * 650;
  }
  if (!ui.sacc.checked) { sacX = 0; sacY = 0; }

  let blinkCov = 0;
  if (ui.blink.checked && !reduced) {
    if (blinkStart < 0 && now >= nextBlink) blinkStart = now;
    if (blinkStart >= 0) {
      const t = now - blinkStart;
      if (t < 70) blinkCov = t / 70;
      else if (t < 95) blinkCov = 1;
      else if (t < 205) blinkCov = 1 - (t - 95) / 110;
      else {
        blinkStart = -1;
        if (!doublePending && Math.random() < 0.18) { nextBlink = now + 240; doublePending = true; }
        else { nextBlink = now + 2400 + Math.random() * 3600; doublePending = false; }
      }
      if (blinkCov > 0.02) state = 'blink';
    }
  }

  gaze.k = parseFloat(ui.stiff.value);
  gaze.c = reduced ? 2 * Math.sqrt(gaze.k * gaze.m) : 22;
  stepSpring(gaze, tx + sacX, ty + sacY, dt);

  const range = parseFloat(ui.range.value);
  const qx = Math.max(-1, Math.min(1, gaze.x * range));
  const qy = Math.max(-0.85, Math.min(0.85, gaze.y * range));
  const col = nearestIdx(GX, qx), row = nearestIdx(GY, qy);
  const key = col + '_' + row + '_' + Math.round(blinkCov * 12);
  stack.style.transform = 'translate(' + (gaze.x * 5).toFixed(2) + 'px,' + (gaze.y * 4).toFixed(2) + 'px) rotate(' + (gaze.x * 0.5).toFixed(3) + 'deg)';
  if (key !== lastKey || blinkCov > 0) {
    ctx.drawImage(sheet, col * 640, row * 640, 640, 640, 0, 0, 640, 640);
    drawBlink(blinkCov, qx, qy);
    lastKey = key;
    readout.textContent = 'state: ' + state + '  gaze: ' + gaze.x.toFixed(2) + ', ' + gaze.y.toFixed(2) + '  frame: col ' + col + ' row ' + row;
  }
}
requestAnimationFrame(frame);
</script>
</body>
</html>
