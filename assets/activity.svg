<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub activity - live systems and language mix">
  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914">
        <animate attributeName="stop-color" values="#050914;#0B1030;#050914" dur="14s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0A1230">
        <animate attributeName="stop-color" values="#0A1230;#160F38;#0A1230" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="barP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="barH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="aglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="330" fill="url(#abg)"/>
  <rect x="1" y="1" width="1198" height="328" fill="none" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="1.5"/>
  <g stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="82" x2="1200" y2="82"/>
    <line x1="0" y1="165" x2="1200" y2="165"/>
    <line x1="0" y1="248" x2="1200" y2="248"/>
    <line x1="300" y1="0" x2="300" y2="330"/>
    <line x1="600" y1="0" x2="600" y2="330"/>
    <line x1="900" y1="0" x2="900" y2="330"/>
  </g>

  <text x="44" y="52" font-family="Courier New, monospace" font-size="17" letter-spacing="4" fill="#7DD3FC">SYSTEM TELEMETRY</text>
  <circle cx="1052" cy="45" r="6" fill="#34D399" filter="url(#aglow)">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="1070" y="51" font-family="Courier New, monospace" font-size="14" letter-spacing="2" fill="#34D399">LIVE</text>

  <text x="44" y="104" font-family="Courier New, monospace" font-size="14" letter-spacing="2" fill="#93A7C9">LANGUAGE MIX - SHARE OF PUBLIC REPOS</text>

  <text x="44" y="152" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#E6EEFC">Python</text>
  <rect x="150" y="136" width="400" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="150" y="136" width="0" height="16" rx="8" fill="url(#barP)">
    <animate attributeName="width" values="0;300" dur="1.8s" begin="0.2s" fill="freeze"/>
  </rect>
  <text x="566" y="152" font-family="Courier New, monospace" font-size="17" fill="#22D3EE">75%</text>

  <text x="44" y="204" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="bold" fill="#E6EEFC">HTML</text>
  <rect x="150" y="188" width="400" height="16" rx="8" fill="#FFFFFF" fill-opacity="0.07"/>
  <rect x="150" y="188" width="0" height="16" rx="8" fill="url(#barH)">
    <animate attributeName="width" values="0;100" dur="1.8s" begin="0.45s" fill="freeze"/>
  </rect>
  <text x="566" y="204" font-family="Courier New, monospace" font-size="17" fill="#A78BFA">25%</text>

  <text x="44" y="262" font-family="Courier New, monospace" font-size="14" letter-spacing="2" fill="#93A7C9">PRIMARY STACK</text>
  <text x="44" y="292" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#E6EEFC">GCP - Kubernetes - Terraform - AI agents</text>

  <g font-family="Courier New, monospace">
    <rect x="660" y="96" width="230" height="92" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.3"/>
    <text x="684" y="140" font-size="32" font-weight="bold" fill="#F8FAFC">5</text>
    <text x="684" y="168" font-size="12.5" letter-spacing="2" fill="#93A7C9">PUBLIC REPOS</text>

    <rect x="926" y="96" width="230" height="92" fill="#FFFFFF" fill-opacity="0.04" stroke="#8B5CF6" stroke-opacity="0.35"/>
    <text x="950" y="140" font-size="32" font-weight="bold" fill="#F8FAFC">4</text>
    <text x="950" y="168" font-size="12.5" letter-spacing="2" fill="#93A7C9">FLAGSHIP SYSTEMS</text>

    <rect x="660" y="212" width="230" height="92" fill="#FFFFFF" fill-opacity="0.04" stroke="#8B5CF6" stroke-opacity="0.35"/>
    <text x="684" y="256" font-size="32" font-weight="bold" fill="#F8FAFC">3</text>
    <text x="684" y="284" font-size="12.5" letter-spacing="2" fill="#93A7C9">AI SYSTEMS LIVE</text>

    <rect x="926" y="212" width="230" height="92" fill="#FFFFFF" fill-opacity="0.04" stroke="#22D3EE" stroke-opacity="0.3"/>
    <text x="950" y="256" font-size="32" font-weight="bold" fill="#F8FAFC">2022</text>
    <text x="950" y="284" font-size="12.5" letter-spacing="2" fill="#93A7C9">ON GITHUB SINCE</text>
  </g>
</svg>
