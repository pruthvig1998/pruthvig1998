<svg width="1200" height="24" viewBox="0 0 1200 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divider">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5484D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E5484D" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#E5484D" stop-opacity="0"/>
    </linearGradient>
    <filter id="dglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="11" width="1200" height="2" fill="url(#dl)"/>
  <circle cx="0" cy="12" r="4" fill="#E5D9BE" filter="url(#dglow)">
    <animate attributeName="cx" values="60;1140;60" dur="9s" repeatCount="indefinite"/>
  </circle>
</svg>