<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami - terminal profile">
  <defs><linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F1E4DC"/><stop offset="1" stop-color="#FBF4EF"/></linearGradient>
    <filter id="wglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="620" rx="18" fill="url(#wbg)"/>
  <rect x="1" y="1" width="1198" height="618" rx="17" fill="none" stroke="#E5484D" stroke-opacity="0.30" stroke-width="1.5"/>
  <rect width="1200" height="64" rx="18" fill="#FFFFFF" fill-opacity="0.04"/>
  <circle cx="38" cy="32" r="9" fill="#C96F5A"/><circle cx="72" cy="32" r="9" fill="#D9B36A"/><circle cx="106" cy="32" r="9" fill="#8FA98F"/>
  <text x="600" y="40" text-anchor="middle" font-family="Courier New, monospace" font-size="19" fill="#6E6259">pruthvi@ukg: ~/profile - zsh</text>
  <g font-family="Courier New, monospace" font-size="25">
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.3s" dur="0.01s" fill="freeze"/><text x="44" y="128" fill="#C2323B">$</text><text x="76" y="128" fill="#2A0E16">whoami</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="0.8s" dur="0.01s" fill="freeze"/><text x="76" y="172" fill="#E5484D">Pruthvi Garlapati</text><text x="76" y="206" fill="#6E6259">Senior GCP DevOps Engineer @ UKG - Toronto</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="1.5s" dur="0.01s" fill="freeze"/><text x="44" y="268" fill="#C2323B">$</text><text x="76" y="268" fill="#2A0E16">cat stack.txt</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.0s" dur="0.01s" fill="freeze"/><text x="76" y="312" fill="#6E6259">GKE - Terraform - Argo CD - Cloud Run - GitOps</text><text x="76" y="346" fill="#6E6259">AI agents with evidence grounding and evals</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="2.7s" dur="0.01s" fill="freeze"/><text x="44" y="408" fill="#C2323B">$</text><text x="76" y="408" fill="#2A0E16">./status --now</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.2s" dur="0.01s" fill="freeze"/><text x="76" y="452" fill="#6E6259">Live: Sach - QuantPilot - Cluse paper desk</text><text x="76" y="486" fill="#6E6259">Open to: Senior GCP / Platform roles</text></g>
    <g opacity="0"><animate attributeName="opacity" values="0;1" begin="3.9s" dur="0.01s" fill="freeze"/><text x="44" y="548" fill="#C2323B">$</text><rect x="78" y="524" width="15" height="28" fill="#E5484D" filter="url(#wglow)"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect></g>
  </g>
</svg>