<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pruthvi Garlapati - Senior GCP DevOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0E"/><stop offset="1" stop-color="#141519"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.13"/><stop offset="1" stop-color="#C6A15B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C6A15B"/>
      <stop offset="1" stop-color="#E5D9BE" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <ellipse cx="300" cy="60" rx="420" ry="170" fill="url(#glow1)">
    <animate attributeName="cx" values="300;900;300" dur="26s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="950" cy="260" rx="380" ry="150" fill="url(#glow1)" opacity="0.7">
    <animate attributeName="cx" values="950;350;950" dur="32s" repeatCount="indefinite"/>
  </ellipse>
  <g stroke="#FFFFFF" stroke-opacity="0.035">
    <path d="M100 0 V300 M300 0 V300 M500 0 V300 M700 0 V300 M900 0 V300 M1100 0 V300"/>
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200"/>
  </g>
  <g stroke="#C6A15B" stroke-opacity="0.30" stroke-width="1.4">
    <path d="M26 44 V26 H44" fill="none"/><path d="M1156 26 H1174 V44" fill="none"/>
    <path d="M26 256 V274 H44" fill="none"/><path d="M1156 274 H1174 V256" fill="none"/>
  </g>
  <g fill="none" stroke="#C6A15B" stroke-opacity="0.35">
    <polyline points="120,210 260,150 400,185 560,105" />
    <polyline points="760,120 900,80 1040,140" opacity="0.6"/>
  </g>
  <g fill="#E5D9BE">
    <circle cx="260" cy="150" r="3.5"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="105" r="3.5"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="80" r="3.5"><animate attributeName="opacity" values="0.9;0.35;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>
  <text x="600" y="148" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="bold" fill="#ECE7DF" filter="url(#soft)">Pruthvi Garlapati</text>
  <rect x="360" y="172" width="480" height="2" fill="url(#rule)">
    <animate attributeName="width" values="480;560;480" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x" values="360;320;360" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="216" text-anchor="middle" font-family="Courier New, monospace" font-size="19" letter-spacing="4" fill="#C6A15B">SENIOR GCP DEVOPS ENGINEER | PLATFORM AND AI AGENT BUILDER</text>
  <text x="600" y="258" text-anchor="middle" font-family="Courier New, monospace" font-size="13.5" letter-spacing="3" fill="#9C968B">GKE - TERRAFORM - ARGO CD - EVIDENCE-GROUNDED AI SYSTEMS</text>
</svg>