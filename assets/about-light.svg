ill="#7A2233">Based between Hyderabad and Toronto - Canadian permanent resident.</text><line x1="772" y1="44" x2="772" y2="356" stroke="#FFFFFF" stroke-opacity="0.08"/><text x="800" y="66" font-family="Courier New, monospace" font-size="13.5" letter-spacing="3" fill="#E5484D">CERTIFIED</text><text x="800" y="90" font-family="Verdana, Geneva, sans-serif" font-size="14.5" fill="#2A0E16">Google Cloud Professional</text><text x="800" y="111" font-family="Verdana, Geneva, sans-serif" font-size="14.5" fill="#2A0E16">Cloud DevOps Engineer</text><text x="800" y="132" font-family="Verdana, Geneva, sans-serif" font-size="14.5" fill="#2A0E16">PagerDuty Foundational Practitioner</text><text x="800" y="173" font-family="Courier New, monospace" font-size="13.5" letter-spacing="3" fill="#E5484D">EDUCATION</text><text x="800" y="197" font-family="Verdana, Geneva, sans-serif" font-size="14.5" fill="#2A0E16">BTech - CVR College of Engineering</text><text x="800" y="218" font-family="Verdana, Geneva, sans-serif" font-size="14.5" fill="#2A0E16">PG diplomas - Cloud Computing</text><text x="800" y="239" font-family="Verdana, Geneva, sans-serif" font-size="14.5" fill="#2A0E16">(George Brown), Business Analytics</text><text x="800" y="260" font-family="Verdana, Geneva, sans-serif" font-size="14.5" fill="#2A0E16">(Cambrian)</text><text x="800" y="301" font-family="Courier New, monospace" font-size="13.5" letter-spacing="3" fill="#E5484D">OPEN TO</text><text x="800" y="325" font-family="Verdana, Geneva, sans-serif" font-size="14.5" fill="#2A0E16">Senior GCP / Platform roles</text><text x="800" y="346" font-family="Verdana, Geneva, sans-serif" font-size="14.5" fill="#2A0E16">Toronto hybrid - Canada remote</text><rect x="44" y="392" width="184" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.05" stroke="#E5484D" stroke-opacity="0.4"/><text x="57" y="413" font-family="Courier New, monospace" font-size="13.5" fill="#2A0E16">8+ YEARS IN DEVOPS</text><rect x="240.4" y="392" width="176" height="