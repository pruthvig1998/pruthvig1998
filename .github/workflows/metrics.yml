name: Generate metrics panel

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: pruthvig1998
          filename: github-metrics.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_colors: github
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          config_css: ":root{--color-fg-default:#e6edf3;--color-fg-muted:#9198a1;--color-fg-subtle:#6e7681;--color-canvas-default:#0d1117;--color-canvas-subtle:#151b23;--color-border-default:#3d444d;--color-border-muted:#3d444db3;--color-accent-fg:#4493f8;--color-accent-emphasis:#1f6feb;--color-success-fg:#3fb950;--color-attention-fg:#d29922;--color-danger-fg:#f85149;--color-calendar-graph-day-bg:#151b23;--color-calendar-graph-day-L1-bg:#0e4429;--color-calendar-graph-day-L2-bg:#006d32;--color-calendar-graph-day-L3-bg:#26a641;--color-calendar-graph-day-L4-bg:#39d353}"
